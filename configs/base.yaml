# This file defines the configuration contract shared by local and remote runs.

project:
  name: cats-dogs-mlops
  random_seed: 42

dataset:
  source: "bhavikjikadara/dog-and-cat-classification-dataset"
  version: 1
  raw_dir: data/downloads/PetImages
  validation_report: artifacts/dataset_validation.json
  processed_dir: data/processed/PetImages224
  manifests_dir: data/manifests
  training_manifests_dir: data/manifests/baseline_50
  split_ratios:
    train: 0.8
    validation: 0.1
    test: 0.1

image:
  size: 224
  mode: RGB
  class_labels: [cat, dog]
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  horizontal_flip: true
  rotation_degrees: 15

training:
  model_type: simple_cnn
  batch_size: 16
  epochs: 5
  learning_rate: 0.001
  num_workers: 0
  checkpoint_dir: models/checkpoints
  run_output_dir: artifacts/training

artifacts:
  production_dir: models/production

mlflow:
  experiment_name: cats-vs-dogs
  tracking_uri: "sqlite:///mlruns/mlflow.db"
  artifact_location: mlartifacts

runtime:
  host: 0.0.0.0
  port: 8000
  model_bundle_path: models/production
